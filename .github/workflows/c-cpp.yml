name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build - ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ${{ matrix.distro }}
    strategy:
      matrix:
        distro: [ubuntu:latest, debian:latest, archlinux:latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu/Debian)
      if: contains(matrix.distro, 'ubuntu') || contains(matrix.distro, 'debian')
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          valgrind \
          git

    - name: Install dependencies (Arch)
      if: contains(matrix.distro, 'archlinux')
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm \
          base-devel \
          cmake \
          valgrind

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror -O2 -g"

    - name: Build
      run: cmake --build build --verbose

    - name: Memory Leak Check (Server)
      run: |
        valgrind --leak-check=full --show-leak-kinds=all \
          ./build/kv_store_server &
        sleep 2
        pkill -f kv_store_server || true

    - name: Cache Performance Analysis
      run: |
        valgrind --tool=cachegrind --cachegrind-out-file=/dev/null \
          ./build/kv_store_server &
        sleep 2
        pkill -f kv_store_server || true
